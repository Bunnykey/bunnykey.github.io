<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details | Bunnykey Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-graphite: #1A1A1B;
            --neon-teal: #00F2FF;
            --bg-color: var(--deep-graphite);
            --text-color: #FFFFFF;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        [data-theme="light"] {
            --bg-color: #F4F4F4;
            --text-color: #1A1A1B;
            --panel-bg: rgba(0, 0, 0, 0.05);
            --border-color: rgba(0, 0, 0, 0.1);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
        }
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
        }
        .text-neon { color: var(--neon-teal); }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .placeholder-gradient {
            background: linear-gradient(135deg, #1A1A1B 0%, #00F2FF 100%);
            opacity: 0.2;
        }
    </style>
</head>
<body class="p-8 md:p-24">
    <div class="fixed top-8 right-8 z-50">
        <button id="themeToggle" aria-label="Toggle theme" class="mono text-[10px] uppercase tracking-[0.2em] opacity-40 hover:opacity-100 transition-opacity flex items-center space-x-2">
            <span id="themeLabel">DARK // MODE</span>
            <div class="w-8 h-[1px] bg-current opacity-30"></div>
        </button>
    </div>

    <nav class="w-full max-w-4xl mx-auto mb-16 flex justify-between items-center z-10 relative">
        <a href="gallery.html" class="mono text-xs uppercase tracking-widest opacity-50 hover:opacity-100 transition-opacity">
            ← Back to Showcase
        </a>
        <div class="mono text-xs opacity-30" id="projectCategory">PROJECT_DETAIL</div>
    </nav>

    <main class="w-full max-w-4xl mx-auto" id="projectContainer">
        <div class="mono text-xs opacity-30 text-center py-20" id="loadingIndicator">FETCHING_PROJECT_DATA...</div>
    </main>

    <script>
        async function init() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const container = document.getElementById('projectContainer');
            const catDisplay = document.getElementById('projectCategory');

            try {
                const response = await fetch('projects.json');
                const data = await response.json();
                const project = data.projects.find(p => p.id === id);

                if (!project) {
                    container.innerHTML = '<div class="mono text-xs opacity-30 text-center py-20">ERROR: PROJECT_NOT_FOUND</div>';
                    return;
                }

                document.title = `${project.title} | Bunnykey Archive`;
                catDisplay.innerText = `CATEGORY: ${project.category.toUpperCase()}`;

                container.innerHTML = `
                    <header class="mb-12">
                        <span class="mono text-xs text-neon uppercase tracking-widest">${project.year} // ${project.category}</span>
                        <h1 class="text-5xl md:text-7xl font-black mt-4 uppercase leading-none">${project.title}</h1>
                    </header>

                    <div class="aspect-video glass-panel mb-12 relative overflow-hidden flex items-center justify-center">
                        <div class="placeholder-gradient absolute inset-0"></div>
                        <span class="mono text-4xl opacity-20">${project.image}</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
                        <div class="md:col-span-2">
                            <h2 class="mono text-xs uppercase opacity-30 mb-4 tracking-widest">Description</h2>
                            <p class="text-xl leading-relaxed opacity-80">${project.description}</p>
                        </div>
                        <div>
                            <h2 class="mono text-xs uppercase opacity-30 mb-4 tracking-widest">Technologies</h2>
                            <ul class="space-y-2">
                                ${project.tech.map(t => `<li class="mono text-sm text-neon">> ${t}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = '<div class="mono text-xs opacity-30 text-center py-20">ERROR: DATABASE_OFFLINE</div>';
            }
        }

        // Theme Logic
        const themeToggle = document.getElementById('themeToggle');
        const themeLabel = document.getElementById('themeLabel');
        const setTheme = (theme) => {
            document.documentElement.setAttribute('data-theme', theme);
            themeLabel.innerText = theme === 'light' ? 'LIGHT // MODE' : 'DARK // MODE';
            localStorage.setItem('theme', theme);
        };
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            setTheme(currentTheme === 'light' ? 'dark' : 'light');
        });
        const savedTheme = localStorage.getItem('theme') || 'dark';
        setTheme(savedTheme);

        init();
    </script>
</body>
</html>
