backend:
  name: github
  repo: bunnykey/bunnykey.github.io
  branch: main
  # Cloudflare Worker 배포 후 실제 workers.dev 주소로 바꾸세요.
  base_url: https://REPLACE_WITH_YOUR_WORKER.workers.dev
  auth_endpoint: auth

locale: ko
publish_mode: simple
media_folder: public/img
public_folder: /img
site_url: https://bunnykey.github.io
display_url: https://bunnykey.github.io
logo_url: /favicon.svg

collections:
  - name: seeds
    label: 짧은 기록
    label_singular: 짧은 기록
    folder: src/content/seeds
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 발행일, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: 한 줄 소개, name: summary, widget: string, required: false }
      - { label: 태그, name: tags, widget: list, required: false }
      - { label: 본문, name: body, widget: markdown }

  - name: flora
    label: 긴 글
    label_singular: 긴 글
    folder: src/content/flora
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 발행일, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: 한 줄 소개, name: summary, widget: string, required: false }
      - { label: 태그, name: tags, widget: list, required: false }
      - { label: 대표 글로 표시, name: highlight, widget: boolean, required: false, default: false }
      - { label: 본문, name: body, widget: markdown }

  - name: nursery
    label: 프로젝트
    label_singular: 프로젝트
    folder: src/content/nursery
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 발행일, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: 한 줄 소개, name: summary, widget: string, required: false }
      - { label: 태그, name: tags, widget: list, required: false }
      - label: 진행 상태
        name: stage
        widget: select
        default: seed
        options:
          - { label: 시작, value: seed }
          - { label: 진행 중, value: growing }
          - { label: 완료, value: evergreen }
      - { label: 본문, name: body, widget: markdown }
