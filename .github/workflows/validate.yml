name: Validate changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 scripts/verify_repo_state.py
      - run: python3 scripts/verify_content_structure.py
      - run: npm test
      - run: npm run build
      - run: python3 scripts/verify_dist.py dist
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Test desktop and mobile Safari flows
        run: npm run test:e2e
      - name: Save browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
