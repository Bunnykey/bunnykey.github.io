<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bunnykey 글쓰기</title><link rel="stylesheet" href="/radix.css"><link rel="stylesheet" href="/design/reading.css"><link rel="stylesheet" href="/styles.css"></head><body><div data-is-root-theme="true" data-accent-color="sage" data-gray-color="olive" data-has-background="true" data-panel-background="translucent" data-radius="small" data-scaling="100%" id="studio-theme" class="radix-themes"><div id="app"><aside id="sidebar"><div class="sidebar-header"><div><p class="eyebrow">BUNNYKEY</p><h1>내 글</h1></div><div class="header-actions"><button data-accent-color="" id="theme-toggle" aria-label="화면 테마 바꾸기" title="화면 테마 바꾸기" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button icon-btn">◐</button><button data-accent-color="" id="sidebar-toggle" aria-label="글 목록 접기" title="글 목록 접기" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button icon-btn mobile-only">☰</button></div><button data-accent-color="" id="new-post" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-solid rt-Button btn-primary">+ 새 글 쓰기</button></div><div class="sidebar-git" hidden="" aria-label="저장소 상태"><span id="git-branch"></span><span id="git-changes"></span></div><label for="local-drafts">이 기기의 미저장 글</label><select id="local-drafts"><option value="">복원할 글 선택</option></select><div id="post-list"></div></aside><main id="main"><header id="topbar"><div class="writing-header"><div class="title-wrap"><div class="rt-TextFieldRoot rt-r-size-2 rt-variant-surface"><input spellCheck="false" id="fm-title" type="text" placeholder="제목을 입력하세요" aria-label="글 제목" class="rt-reset rt-TextFieldInput"/></div><div class="rt-TextFieldRoot rt-r-size-2 rt-variant-surface"><input spellCheck="false" id="fm-summary" type="text" placeholder="한 줄 소개를 적어보세요 (선택)" aria-label="글 요약" class="rt-reset rt-TextFieldInput"/></div></div><div class="publish-actions"><button data-accent-color="" id="preview-toggle" aria-pressed="false" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button btn-secondary">미리보기</button><button data-accent-color="" id="compare-conflict" hidden="" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button btn-secondary">최신본 비교</button><button data-accent-color="" id="save" title="임시 저장 (Ctrl+S)" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button btn-secondary">임시 저장</button><button data-accent-color="" id="publish" title="공개하고 GitHub에 발행" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-solid rt-Button btn-primary">발행하기</button></div></div><details class="post-settings"><summary>글 설정</summary><div class="fm-row"><label>분류<select id="fm-collection"><option value="seeds">짧은 기록 (seeds)</option><option value="flora">긴 글 (flora)</option><option value="nursery">프로젝트 (nursery)</option></select></label><label>주제<select id="fm-category"><option value="notes">기록</option><option value="life">일상</option><option value="food">요리</option><option value="music">음악</option><option value="travel">여행</option><option value="tech">기술</option></select></label><label>프로젝트 단계<select id="fm-stage"><option value="">해당 없음</option><option value="seed">시작</option><option value="growing">진행</option><option value="evergreen">유지</option></select></label><label>시리즈 주소<div class="rt-TextFieldRoot rt-r-size-2 rt-variant-surface"><input spellCheck="false" id="fm-series-name" placeholder="예: making-music" class="rt-reset rt-TextFieldInput"/></div></label><label>시리즈 제목<div class="rt-TextFieldRoot rt-r-size-2 rt-variant-surface"><input spellCheck="false" id="fm-series-title" class="rt-reset rt-TextFieldInput"/></div></label><label>시리즈 순서<div class="rt-TextFieldRoot rt-r-size-2 rt-variant-surface"><input spellCheck="false" id="fm-series-order" type="number" min="1" step="1" class="rt-reset rt-TextFieldInput"/></div></label><label>주소<div class="rt-TextFieldRoot rt-r-size-2 rt-variant-surface"><input spellCheck="false" id="fm-slug" type="text" placeholder="자동으로 만들어집니다" class="rt-reset rt-TextFieldInput"/></div><span id="slug-warn" class="warn"></span></label><label>날짜<div class="rt-TextFieldRoot rt-r-size-2 rt-variant-surface"><input spellCheck="false" id="fm-date" type="date" class="rt-reset rt-TextFieldInput"/></div></label><label>태그<div class="rt-TextFieldRoot rt-r-size-2 rt-variant-surface"><input spellCheck="false" id="fm-tags" type="text" list="tag-suggestions" placeholder="예: 일상, 책, 사진" class="rt-reset rt-TextFieldInput"/></div><datalist id="tag-suggestions"></datalist></label><label class="check" hidden=""><input id="fm-draft" type="checkbox" checked=""/> 초안</label><p>저장은 작업 초안을 보관합니다. 공개 사이트에는 발행 후 반영됩니다.</p><label class="advanced-setting">데모<select id="fm-demo"><option value="">없음</option></select></label></div></details></header><nav id="toolbar" aria-label="글쓰기 도구"><button data-accent-color="" data-action="bold" title="굵게 (Ctrl+B)" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button"><b>B</b></button><button data-accent-color="" data-action="italic" title="기울임 (Ctrl+I)" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button"><i>I</i></button><button data-accent-color="" data-action="link" title="링크" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button">링크</button><button data-accent-color="" id="media-insert" title="Spotify, YouTube, GitHub 링크 넣기" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button">미디어</button><button data-accent-color="" id="mode-toggle" aria-pressed="false" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button">Markdown</button><button data-accent-color="" data-action="image" title="사진 넣기" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button">사진</button><button data-accent-color="" data-action="h2" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button">소제목</button><button data-accent-color="" data-action="table" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button">표</button><button data-accent-color="" data-action="code" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button advanced-setting">코드</button><select id="insert-demo" class="advanced-setting"><option value="">+ 데모 삽입</option></select><label class="toolbar-toggle advanced-setting"><input id="ai-toggle" type="checkbox"/> AI</label><span class="spacer"></span><span id="word-count"></span><span id="ext-badge" class="advanced-setting"></span><button data-accent-color="" id="delete-post" title="저장한 작업 초안만 버리기" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button btn-danger">초안 버리기</button></nav><div id="split"><section id="editor-pane" aria-label="글 작성"><div id="rich-editor"></div><div id="editor-stack" hidden=""><div id="ghost" aria-hidden="true"></div><textarea id="editor" spellCheck="true" placeholder="편하게 이야기를 시작해 보세요.

사진은 위의 ‘사진’ 버튼을 누르거나, 이곳에 끌어다 놓으면 됩니다."></textarea></div><div id="ai-status" hidden=""></div></section><div id="divider" title="끌어서 편집 영역 크기 조절"></div><section id="preview-pane" aria-label="미리보기"><p class="pane-label">미리보기</p><header class="reading-header"><p id="preview-date" class="reading-meta"></p><h1 id="preview-title" class="reading-title"></h1><p id="preview-summary" class="reading-summary"></p></header><div id="toc" hidden=""></div><article id="preview" class="journal-prose"></article></section></div><footer id="status" role="status" aria-live="polite"><span id="status-msg">준비됨</span><span class="spacer"></span><span id="reading-time"></span></footer></main></div><div id="find-overlay" class="overlay" hidden=""><div class="overlay-box"><div class="overlay-row"><div class="rt-TextFieldRoot rt-r-size-2 rt-variant-surface"><input spellCheck="false" id="find-input" type="text" placeholder="찾기" class="rt-reset rt-TextFieldInput"/></div><span id="find-count">0/0</span><button data-accent-color="" id="find-prev" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button">이전</button><button data-accent-color="" id="find-next" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button">다음</button></div><div class="overlay-row"><div class="rt-TextFieldRoot rt-r-size-2 rt-variant-surface"><input spellCheck="false" id="replace-input" type="text" placeholder="바꾸기" class="rt-reset rt-TextFieldInput"/></div><button data-accent-color="" id="replace-one" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button">바꾸기</button><button data-accent-color="" id="replace-all" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button">모두 바꾸기</button><button data-accent-color="" id="find-close" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button">닫기</button></div></div></div><dialog id="conflict-dialog"><h2>수정 충돌 확인</h2><p>최신 서버 내용과 현재 입력을 비교하세요. 닫은 뒤 본문·글 설정에서 직접 병합하고 다시 비교할 수 있습니다. 저장 버튼은 현재 입력한 본문과 설정을 병합 결과로 사용합니다.</p><label>최신 서버 내용<textarea id="conflict-latest" readOnly="" rows="8"></textarea></label><label>현재 입력 내용<textarea id="conflict-local" readOnly="" rows="8"></textarea></label><button data-accent-color="" id="conflict-close" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button">닫고 수정</button><button data-accent-color="" id="conflict-merge" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button">현재 입력을 병합본으로 저장</button></dialog><dialog id="media-dialog"><form id="media-form"><h2>미디어 넣기</h2><p>Spotify · YouTube / YouTube Music · GitHub</p><label for="media-url">미디어 주소</label><div class="rt-TextFieldRoot rt-r-size-2 rt-variant-surface"><input spellCheck="false" id="media-url" type="url" required="" placeholder="https://..." class="rt-reset rt-TextFieldInput"/></div><p id="media-error" role="alert"></p><div class="dialog-actions"><button data-accent-color="" type="button" id="media-cancel" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button">취소</button><button data-accent-color="" type="submit" class="rt-reset rt-BaseButton rt-r-size-2 rt-variant-surface rt-Button btn-primary">넣기</button></div></form></dialog><input type="file" id="file-input" accept="image/*" hidden=""/></div><script type="module" src="/app.js"></script></body></html>
