# Hosted editor: https://app.pagescms.org — Astro/GitHub Pages still publish the site.
# Operating instructions and verification limits: docs/operations/pages-cms.md
media:
  - name: images
    label: 글 이미지
    input: public/img
    output: /img
    extensions: [jpg, jpeg, png, gif, webp, avif]
    rename: random

settings:
  content:
    # Preserve id, contractVersion, sourceId and other metadata owned by existing writers.
    merge: true

components:
  post-title:
    label: 제목
    type: string
    required: true
    pattern:
      regex: '\S'
      message: 제목을 입력해 주세요.
  post-date:
    label: 날짜
    type: date
    required: true
    options:
      format: yyyy-MM-dd
      time: false
  post-summary:
    label: 요약
    type: text
  post-tags:
    label: 태그
    type: string
    list: true
  post-category:
    label: 주제
    type: select
    required: true
    default: notes
    options:
      values:
        - {name: life, label: 일상}
        - {name: food, label: 음식}
        - {name: music, label: 음악}
        - {name: travel, label: 여행}
        - {name: tech, label: 기술}
        - {name: notes, label: 메모}
  post-series:
    label: 시리즈 (선택)
    type: object
    description: 연재할 때만 이름·제목·순서를 모두 입력하세요. 비워 두면 단독 글입니다.
    fields:
      - name: name
        label: 시리즈 주소
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: 영문 소문자·숫자·하이픈으로 입력하세요.
      - name: title
        label: 시리즈 제목
        type: string
        required: true
        pattern: '\S'
      - name: order
        label: 읽는 순서
        type: number
        required: true
        options:
          min: 1
          step: 1
  post-draft:
    label: 초안 (공개하지 않음)
    type: boolean
    default: true
    description: 새 글은 켠 상태로 저장하세요. 끄고 main에 저장하면 배포가 시작됩니다. 공개 글에서 켜면 다음 배포 때 글이 내려갑니다. GitHub 파일과 업로드 이미지는 공개 저장소에 남습니다.
  post-body:
    label: 본문
    type: rich-text
    description: Editor에서 글과 이미지를 확인하세요. 블로그의 글꼴·임베드·데모는 Astro에서 확인해야 합니다. embed 코드 블록이나 HTML을 수정할 때는 Source 모드를 사용하세요.
    options:
      format: markdown
      switcher: true
      media: images
      rename: random
  post-preview:
    label: 공개 미리보기 링크 만들기
    type: boolean
    default: false
    description: 초안에서 켜고 main에 저장하면, 배포 후 블로그 글쓰기 → 미리보기에서 실제 화면을 볼 수 있습니다. 링크는 누구나 열 수 있습니다. 끄고 저장하면 다음 배포에서 삭제됩니다. 검색·RSS·공개 글 목록에는 포함하지 않습니다.

content:
  - name: flora
    label: Flora · 에세이
    type: collection
    path: src/content/flora
    format: yaml-frontmatter
    # A timestamp works for Korean-only titles too; title edits never change the route.
    filename:
      template: '{year}-{month}-{day}-{hour}{minute}{second}.md'
      field: create
    subfolders: false
    exclude: [README.md]
    operations: {create: true, rename: false, delete: false}
    view:
      primary: title
      fields: [title, date, category, draft]
      sort: [date]
      default: {sort: date, order: desc}
    fields:
      - {name: title, component: post-title}
      - {name: date, component: post-date}
      - {name: summary, component: post-summary}
      - {name: category, component: post-category}
      - {name: tags, component: post-tags}
      - {name: series, component: post-series}
      - name: highlight
        label: 대표 글
        type: boolean
      - name: demo
        label: 인터랙티브 데모 (선택)
        type: select
        options:
          values: [TokenFlowDemo, ApiFlowDemo]
      - {name: draft, component: post-draft}
      - {name: sharePreview, component: post-preview}
      - {name: body, component: post-body}

  - name: seeds
    label: Seeds · 짧은 기록
    type: collection
    path: src/content/seeds
    format: yaml-frontmatter
    filename:
      template: '{year}-{month}-{day}-{hour}{minute}{second}.md'
      field: create
    subfolders: false
    exclude: [README.md]
    operations: {create: true, rename: false, delete: false}
    view:
      primary: title
      fields: [title, date, category, draft]
      sort: [date]
      default: {sort: date, order: desc}
    fields:
      - {name: title, component: post-title}
      - {name: date, component: post-date}
      - {name: summary, component: post-summary}
      - {name: category, component: post-category}
      - {name: tags, component: post-tags}
      - {name: series, component: post-series}
      - name: demo
        label: 인터랙티브 데모 (선택)
        type: select
        options:
          values: [ApiFlowDemo]
      - {name: draft, component: post-draft}
      - {name: sharePreview, component: post-preview}
      - {name: body, component: post-body}

  - name: nursery
    label: Nursery · 자라는 글
    type: collection
    path: src/content/nursery
    format: yaml-frontmatter
    filename:
      template: '{year}-{month}-{day}-{hour}{minute}{second}.md'
      field: create
    subfolders: false
    exclude: [README.md]
    operations: {create: true, rename: false, delete: false}
    view:
      primary: title
      fields: [title, date, category, draft]
      sort: [date]
      default: {sort: date, order: desc}
    fields:
      - {name: title, component: post-title}
      - {name: date, component: post-date}
      - {name: summary, component: post-summary}
      - {name: category, component: post-category}
      - {name: tags, component: post-tags}
      - {name: series, component: post-series}
      - name: stage
        label: 성장 단계 (선택)
        type: select
        options:
          values:
            - {name: seed, label: 씨앗}
            - {name: growing, label: 성장 중}
            - {name: evergreen, label: 늘 푸름}
      - {name: draft, component: post-draft}
      - {name: sharePreview, component: post-preview}
      - {name: body, component: post-body}

  - name: kpop-tiers
    label: 음악 · 월별 케이팝 티어
    type: file
    path: src/data/kpop-months.json
    format: json
    list: true
    fields:
      - name: month
        label: 발매 월 (YYYY-MM)
        type: string
        required: true
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      - name: revision
        label: 곡 목록 버전
        type: string
        required: true
        description: 곡을 추가·삭제하거나 ID를 변경하면 버전을 올리세요. 평가·한줄평 변경에는 유지합니다. 목록 버전이 바뀌면 이전 방문자 배치와 공유 링크는 새 목록에 적용되지 않습니다.
      - name: demo
        label: 가상 데이터 표시
        type: boolean
        default: false
      - name: published
        label: 공개
        type: boolean
        default: false
        description: 공개를 켜고 main에 저장하면 GitHub Pages 배포 후 목록에 나타납니다. 비공개 항목도 공개 저장소 파일에는 남습니다.
      - name: intro
        label: 이달의 짧은 소개
        type: text
      - name: tracks
        label: 곡 목록 (같은 티어에서는 이 순서로 표시)
        type: object
        list:
          min: 1
          max: 300
          collapsible:
            collapsed: true
            summary: '{artist} · {title}'
        fields:
          - name: id
            label: 고유 ID (평가 후 변경하지 마세요)
            type: string
            required: true
            pattern: '^[a-zA-Z0-9_-]{1,80}$'
          - {name: title, label: 곡 제목, type: string, required: true}
          - {name: artist, label: 아티스트, type: string, required: true}
          - name: released
            label: 발매일
            type: date
            required: true
            options: {format: yyyy-MM-dd, time: false}
          - name: tier
            label: 내 평가
            type: select
            required: true
            default: unranked
            options:
              values:
                - {name: S, label: S}
                - {name: A, label: A}
                - {name: B, label: B}
                - {name: C, label: C}
                - {name: D, label: D}
                - {name: unranked, label: 미평가}
          - {name: note, label: 한줄평, type: text}
          - name: color
            label: 카드 색상 (#RRGGBB)
            type: string
            pattern: '^#[0-9a-fA-F]{6}$'
          - {name: cover, label: 앨범 이미지 (선택), type: image}
          - name: listenUrl
            label: 공식 YouTube·Spotify 링크 (선택)
            type: string
            pattern: '^https://(www\.)?(youtube\.com|youtu\.be|open\.spotify\.com)/'
