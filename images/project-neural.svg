<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-neural" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1B"/>
      <stop offset="100%" style="stop-color:#1F1F20"/>
    </linearGradient>
    <linearGradient id="node-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F2FF"/>
      <stop offset="100%" style="stop-color:#00F2FF;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-neural)"/>
  <!-- Neural network connections -->
  <g stroke="#00F2FF" stroke-width="1" opacity="0.2">
    <!-- Layer 1 to Layer 2 -->
    <line x1="150" y1="100" x2="300" y2="80"/>
    <line x1="150" y1="100" x2="300" y2="150"/>
    <line x1="150" y1="100" x2="300" y2="220"/>
    <line x1="150" y1="180" x2="300" y2="80"/>
    <line x1="150" y1="180" x2="300" y2="150"/>
    <line x1="150" y1="180" x2="300" y2="220"/>
    <line x1="150" y1="260" x2="300" y2="80"/>
    <line x1="150" y1="260" x2="300" y2="150"/>
    <line x1="150" y1="260" x2="300" y2="220"/>
    <line x1="150" y1="340" x2="300" y2="150"/>
    <line x1="150" y1="340" x2="300" y2="220"/>
    <line x1="150" y1="340" x2="300" y2="290"/>
    <!-- Layer 2 to Layer 3 -->
    <line x1="300" y1="80" x2="450" y2="120"/>
    <line x1="300" y1="80" x2="450" y2="200"/>
    <line x1="300" y1="150" x2="450" y2="120"/>
    <line x1="300" y1="150" x2="450" y2="200"/>
    <line x1="300" y1="150" x2="450" y2="280"/>
    <line x1="300" y1="220" x2="450" y2="120"/>
    <line x1="300" y1="220" x2="450" y2="200"/>
    <line x1="300" y1="220" x2="450" y2="280"/>
    <line x1="300" y1="290" x2="450" y2="200"/>
    <line x1="300" y1="290" x2="450" y2="280"/>
    <line x1="300" y1="360" x2="450" y2="280"/>
    <line x1="300" y1="360" x2="450" y2="360"/>
    <!-- Layer 3 to Layer 4 -->
    <line x1="450" y1="120" x2="600" y2="160"/>
    <line x1="450" y1="120" x2="600" y2="240"/>
    <line x1="450" y1="200" x2="600" y2="160"/>
    <line x1="450" y1="200" x2="600" y2="240"/>
    <line x1="450" y1="200" x2="600" y2="320"/>
    <line x1="450" y1="280" x2="600" y2="160"/>
    <line x1="450" y1="280" x2="600" y2="240"/>
    <line x1="450" y1="280" x2="600" y2="320"/>
    <line x1="450" y1="360" x2="600" y2="320"/>
  </g>
  <!-- Neural nodes - Layer 1 -->
  <circle cx="150" cy="100" r="12" fill="#1A1A1B" stroke="#00F2FF" stroke-width="2"/>
  <circle cx="150" cy="180" r="12" fill="#1A1A1B" stroke="#00F2FF" stroke-width="2"/>
  <circle cx="150" cy="260" r="12" fill="#1A1A1B" stroke="#00F2FF" stroke-width="2"/>
  <circle cx="150" cy="340" r="12" fill="#1A1A1B" stroke="#00F2FF" stroke-width="2"/>
  <!-- Layer 2 -->
  <circle cx="300" cy="80" r="10" fill="url(#node-glow)" opacity="0.8"/>
  <circle cx="300" cy="150" r="10" fill="url(#node-glow)" opacity="0.6"/>
  <circle cx="300" cy="220" r="10" fill="url(#node-glow)" opacity="0.9"/>
  <circle cx="300" cy="290" r="10" fill="url(#node-glow)" opacity="0.5"/>
  <circle cx="300" cy="360" r="10" fill="url(#node-glow)" opacity="0.7"/>
  <!-- Layer 3 -->
  <circle cx="450" cy="120" r="10" fill="url(#node-glow)" opacity="0.7"/>
  <circle cx="450" cy="200" r="10" fill="url(#node-glow)" opacity="0.9"/>
  <circle cx="450" cy="280" r="10" fill="url(#node-glow)" opacity="0.6"/>
  <circle cx="450" cy="360" r="10" fill="url(#node-glow)" opacity="0.4"/>
  <!-- Layer 4 (Output) -->
  <circle cx="600" cy="160" r="14" fill="#00F2FF" opacity="0.9"/>
  <circle cx="600" cy="240" r="14" fill="#00F2FF" opacity="0.7"/>
  <circle cx="600" cy="320" r="14" fill="#00F2FF" opacity="0.5"/>
  <!-- Data flow indicator -->
  <text x="100" y="410" fill="#FFFFFF" font-family="monospace" font-size="10" opacity="0.3">INPUT</text>
  <text x="680" y="240" fill="#FFFFFF" font-family="monospace" font-size="10" opacity="0.3">OUTPUT</text>
  <!-- Label -->
  <text x="400" y="430" fill="#FFFFFF" font-family="monospace" font-size="12" text-anchor="middle" opacity="0.4">NEURAL_ARCHIVE // MEMORY_NODES</text>
</svg>